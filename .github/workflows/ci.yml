name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Package-level tests (services + middleware) are hermetic — they use fakes,
      # no database. The demo's feature tests live in a separate module and need
      # Postgres, so they're intentionally out of this hermetic gate.
      - name: test
        run: go test ./...
        env:
          AUTHKIT_RATE_LIMIT_ATTEMPTS: "100000"
